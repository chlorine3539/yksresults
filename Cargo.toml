[package]
name = "yksresults"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native Unix (Linux/macOS) TUI for tracking YKS TYT and AYT study topics"
license = "MIT"
readme = "README.md"
repository = "https://github.com/chlorine3539/yksresults"

[dependencies]
chrono = "0.4.45"
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
scraper = "0.29.0"
serde_json = "1.0.154"
